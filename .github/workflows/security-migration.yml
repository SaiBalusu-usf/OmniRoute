name: Security migration regressions
on:
  pull_request:
  push:
    branches: [fix/security-migration-20261026]
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck:core
      - run: node --import tsx/esm --test tests/unit/mitm-sanitize-headers.test.ts tests/unit/mitm-masksecrets.test.ts tests/unit/build/mitm-compile-boundary.test.ts tests/unit/compression/rtk-toml-compatibility.test.ts
      - run: npm audit --audit-level=low
      - run: npm ci --ignore-scripts && npm run build && npm test && npm audit --audit-level=low
        working-directory: "@omniroute/opencode-plugin"
